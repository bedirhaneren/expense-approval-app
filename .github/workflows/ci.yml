name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — lint, typecheck, unit and e2e tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: masraf
          POSTGRES_PASSWORD: masraf
          POSTGRES_DB: masraf_test
        # Same host port as local development, so .env.test works unchanged.
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U masraf -d masraf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run test:e2e
      - name: OpenAPI document is up to date
        run: |
          npm run openapi
          git diff --exit-code -- ../../docs/openapi.json

  web:
    name: Web — lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  browser:
    name: Browser — case scenario in Chrome (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start the full stack with Docker Compose
        run: |
          docker compose up --build -d
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/login && exit 0
            sleep 3
          done
          docker compose logs
          exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
